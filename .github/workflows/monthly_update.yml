# Re-run the pipeline once a month and commit the refreshed web data.
# Sentinel-1 (Planetary Computer) needs no secret. For NISAR add repository secrets
# EARTHDATA_USER and EARTHDATA_PASS; without them steps 02-05 are skipped.
name: Monthly update

on:
  schedule:
    - cron: "0 6 3 * *"   # 06:00 UTC on the 3rd of each month
  workflow_dispatch:
    inputs:
      reservoir:
        description: "Reservoirs to process (demo, priority, all, or IDs)"
        default: priority

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      EARTHDATA_USER: ${{ secrets.EARTHDATA_USER }}
      EARTHDATA_PASS: ${{ secrets.EARTHDATA_PASS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run pipeline (last 3 months of Sentinel-1 + NISAR)
        run: |
          START=$(date -d "$(date +%Y-%m-01) -3 month" +%Y-%m)
          EXTRA=""
          if [ -z "$EARTHDATA_USER" ]; then EXTRA="--skip-nisar"; fi
          python run_pipeline.py --reservoir "${{ github.event.inputs.reservoir || 'priority' }}" \
            --start "$START" $EXTRA
      - name: Commit refreshed data
        run: |
          git config user.name "saddsar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/public/data data/processed/*.csv docs/validation_report.md docs/images
          git diff --cached --quiet || git commit -m "Monthly data update $(date +%Y-%m)"
          git push
